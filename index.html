<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Íslenska с нуля</title>
<meta name="description" content="Самоучитель исландского языка с нуля">
<meta name="theme-color" content="#1a221f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Íslenska">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Jost:wght@300;400;500&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: туманный пейзаж-шапка, выезжающее слева меню, одна колонка контента ~760px; исландский текст — книжной антиквой, интерфейс — гротеском */
:root{
  /* единый мир: базальт и мох под туманом, светлые «туманные» листы для контраста */
  --bg:#1a221f; --surface:#222d29; --raised:#2a3732; --ink:#e8ece3; --muted:#a2ad9f; --line:#3a4842;
  --moss:#a9c06b; --moss-soft:color-mix(in srgb,var(--moss) 20%,var(--bg)); --amber:#e3aa56; --amber-soft:color-mix(in srgb,var(--amber) 22%,var(--bg)); --slate:#9cc3c9;
  --lichen:#d4c770; --heather:#c9a0b4;
  --good:#a3d47f; --good-soft:#2c4224; --bad:#f09a86; --bad-soft:#4a2a24;
  --paper:#dfe5da; --paper-2:#c9d4c8; --paper-ink:#1b2420; --paper-muted:#56635c;
  --hill:#0d1311; --fog:#c8d2c8;
  --glass:rgba(38,50,45,.74);
  --g1:#2b3835; --g2:#1f2925; --g3:#18201c; --barbg:rgba(30,40,36,.82); --dr1:#2c3a35; --dr2:#1c2521; --dr3:#223020; --hero-ink:#1b2420; --hero-sub:#3d4a45;
  --f-disp:'Jost','Futura','Century Gothic',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-is:'Literata','Georgia','Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:12px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg) linear-gradient(180deg,var(--g1) 0%,var(--g2) 38%,var(--g3) 100%) fixed;transition:background-color .4s;color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--g1)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,.w:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:var(--slate)}
#backdrop{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.55}
.banner{position:relative;margin-inline:calc(50% - 50vw);height:clamp(140px,22vw,260px);overflow:hidden}
.banner canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner + .les-head{margin-top:-18px;position:relative}
.is{font-family:var(--f-is)}
h1,h2,h3{text-wrap:balance;margin:0}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--barbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.burger{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.burger span{display:block;width:16px;height:1.5px;background:var(--ink);box-shadow:0 5px 0 var(--ink),0 -5px 0 var(--ink)}
.bar-title{flex:1;min-width:0;font:400 13px/1.2 var(--f-disp);letter-spacing:.28em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 9px;border-radius:999px;background:var(--amber-soft);color:var(--ink);font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;border:0}
.chip-ico{width:20px;height:16px;flex:none}
.purse{display:flex;align-items:center;background:var(--amber-soft);border-radius:999px;padding:2px;gap:2px;flex:none}
.purse .chips{background:transparent}
.shopbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--amber);color:#1a1209;display:grid;place-items:center;transition:transform .15s}
.shopbtn svg{width:19px;height:19px}
.shopbtn:hover{transform:scale(1.06)}.shopbtn.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--amber)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(320px,86vw);background:linear-gradient(180deg,var(--dr1),var(--dr2) 60%,var(--dr3));border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 24px) max(18px,env(safe-area-inset-left,0px))}
.drawer.on{transform:none}
.dr-brand{font:300 22px var(--f-disp);letter-spacing:.32em;text-transform:uppercase;margin-bottom:2px}
.dr-sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.dr-sec{font:500 11px var(--f-disp);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
.dr-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:15px}
.dr-item:hover{background:var(--raised)}
.dr-item.cur{background:var(--moss-soft);color:var(--ink)}
.dr-num{font:500 12px var(--f-mono);color:var(--muted);width:22px;flex:none}
.dr-item .ok{margin-left:auto;color:var(--good);font-size:13px}
.dr-soon{display:flex;gap:10px;padding:6px 10px;color:var(--muted);font-size:14px;opacity:.75}

/* page */
main{max-width:820px;margin:0 auto;padding-block:0 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:500 11px var(--f-disp);letter-spacing:.24em;text-transform:uppercase;color:var(--moss)}
.h1{font:300 clamp(28px,6vw,40px)/1.15 var(--f-disp);letter-spacing:.04em;margin:6px 0 8px}
.lead{color:var(--muted);max-width:60ch;margin:0}
.h2{font:400 15px var(--f-disp);letter-spacing:.2em;text-transform:uppercase;margin:34px 0 12px}
p{max-width:65ch}

/* hero */
.hero{position:relative;margin-inline:calc(50% - 50vw);height:clamp(300px,46vw,500px);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-txt{position:absolute;left:0;right:0;top:clamp(22%,10vw,28%);text-align:center;padding:0 16px}
.hero-pre{font:400 10.5px var(--f-disp);letter-spacing:.42em;text-transform:uppercase;color:var(--hero-sub)}
.hero-h{color:var(--hero-ink);font:300 clamp(34px,9vw,64px)/1 var(--f-disp);letter-spacing:.42em;text-transform:uppercase;margin:12px 0 10px;padding-left:.42em}
.hero-sub{font:400 11px var(--f-disp);letter-spacing:.38em;text-transform:uppercase;color:var(--hero-sub)}
.home-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-34px;position:relative}
.stat{backdrop-filter:blur(8px);background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font:500 22px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#1a1209}
.btn:disabled{opacity:.4;cursor:default}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 4px}

.mod{margin-top:26px}
.mod-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.mod-n{font:300 26px var(--f-disp);color:var(--moss);width:34px}
.mod:nth-of-type(3n+2) .mod-n{color:var(--slate)}.mod:nth-of-type(3n) .mod-n{color:var(--amber)}
.mod-t{font:400 14px var(--f-disp);letter-spacing:.2em;text-transform:uppercase}
.les{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 0;border-bottom:1px solid var(--line)}
.les:hover .les-t{color:var(--moss)}
.les:not(.soon):hover{background:linear-gradient(90deg,rgba(169,192,107,.08),transparent)}
.les-n{font:500 13px var(--f-mono);color:var(--muted)}
.les-t{font-weight:500}
.les-s{font-size:13.5px;color:var(--muted)}
.les-st{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.les-st.done{color:var(--good)}
.les.soon{opacity:.55;cursor:default}

/* lesson */
.les-head{padding-top:26px}
.tabs{display:flex;gap:4px;margin:20px 0 6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 12px;font:400 12px var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--amber)}
.theory h3{font:400 14px var(--f-disp);letter-spacing:.18em;text-transform:uppercase;margin:30px 0 8px;color:var(--moss)}
.tip{background:linear-gradient(135deg,var(--paper),var(--paper-2));color:var(--paper-ink);border-radius:var(--r);padding:12px 16px;margin:18px 0;max-width:65ch}
.tip::before{content:"Совет учителя";display:block;font:500 10.5px var(--f-disp);letter-spacing:.22em;text-transform:uppercase;color:#8a5a14;margin-bottom:2px}
.tip .w{border-bottom-color:var(--paper-muted)} .tip .w:hover{background:rgba(0,0,0,.06)}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px}
th{font:500 11px var(--f-disp);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font-family:var(--f-is);font-weight:600;font-size:17px;white-space:nowrap}

/* tappable words */
.w{font-family:var(--f-is);border-bottom:1px dotted var(--slate);cursor:pointer;padding:0 1px;border-radius:3px;transition:background .15s}
.w:hover{background:var(--moss-soft)}
.w.big{font-size:1.15em}

/* alphabet */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:14px 0}
.ltr{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:linear-gradient(160deg,#33453a,#26332d);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-is);font-size:22px;line-height:1.1}
.ltr small{font:400 11px var(--f-body);color:var(--muted)}
.ltr.spc{border-color:var(--amber);background:linear-gradient(160deg,#5a4426,#3b2e1c)}
.ltr.on{background:var(--paper);color:var(--paper-ink);border-color:var(--paper)}
.ltr.on small{color:var(--paper-muted)}
.abc-panel{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;background:linear-gradient(135deg,var(--paper),var(--paper-2));color:var(--paper-ink);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:96px}
.abc-big{font:400 54px/1 var(--f-is);grid-row:span 3}
.abc-panel .nm{font:500 12px var(--f-mono);color:var(--paper-muted)}
.abc-panel .w{border-bottom-color:var(--paper-muted)} .abc-panel .w:hover{background:var(--paper-2)}

/* vocab list */
.vlist{display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow .is{font-size:18px;cursor:pointer}
.vrow .pr{display:block;font:400 13px var(--f-mono);color:var(--muted)}
.vrow .ru{font-size:14.5px;min-width:0}
.star{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;font-size:16px;color:var(--muted)}
.star.on{background:var(--moss);border-color:var(--moss);color:var(--bg)}

/* exercise list */
.exl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:16px}
.exc{text-align:left;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(6px);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.exc:hover{border-color:var(--moss)}
.exc .k{font:500 10.5px var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--slate);display:flex;align-items:center;gap:7px}
.exc .k::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.k-match{color:var(--moss)!important}.k-choice{color:var(--slate)!important}.k-sort{color:var(--lichen)!important}.k-build{color:var(--heather)!important}.k-type{color:var(--fog)!important}.k-memory{color:var(--amber)!important}
.exc .t{font-weight:600}
.exc .d{font-size:13.5px;color:var(--muted)}
.exc .s{font:500 12px var(--f-mono);color:var(--muted);margin-top:6px}
.exc.done .s{color:var(--good)}

/* game */
.game{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(8px);padding:16px;min-height:300px}
.game-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--slate);padding:4px 0;font-size:14px}
.game-name{flex:1;font:400 12px var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);min-width:0}
.prog{font:500 13px var(--f-mono);color:var(--muted)}
.bar-prog{height:3px;background:var(--line);border-radius:2px;margin-bottom:18px;overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--amber);transition:width .3s}
.q{font-size:18px;margin-bottom:16px}
.q .is,.q .isw{font-family:var(--f-is);font-weight:600;font-size:1.15em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--raised);border-radius:var(--r);padding:12px 14px;text-align:left;font-size:16px}
.opt.isf{font-family:var(--f-is);font-size:18px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb{min-height:24px;margin-top:14px;font-size:15px}
.fb.g{color:var(--good)} .fb.b{color:var(--bad)}
.fb .why{display:block;color:var(--muted);margin-top:4px}
.next{margin-top:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mc{border:1px solid var(--line);background:var(--raised);border-radius:var(--r);padding:12px;font-size:15.5px;text-align:center;min-height:50px;transition:opacity .3s,background .2s}
.mc.isf{font-family:var(--f-is);font-size:18px}
.mc.sel{border-color:var(--amber);background:var(--amber-soft)}
.mc.gone{opacity:.25;pointer-events:none;background:var(--good-soft)}
.mc.bad{background:var(--bad-soft)}

.sort-item{text-align:center;font:600 clamp(20px,5.5vw,30px)/1.3 var(--f-is);padding:22px 10px;border:1px dashed var(--line);border-radius:var(--r);margin-bottom:14px;background:var(--raised)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.bucket{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px 10px;font-weight:500}
.bucket .cnt{display:block;font:400 12px var(--f-mono);color:var(--muted)}

.slot{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;padding:6px 0;margin-bottom:18px}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:8px 13px;font:400 18px var(--f-is);box-shadow:0 1px 0 var(--line)}
.tile.used{visibility:hidden}

.inp{width:100%;font:400 20px var(--f-is);padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised);color:var(--ink)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.key{min-width:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font:400 18px var(--f-is)}

.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.mcard{aspect-ratio:4/3;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--hill);color:var(--ink);font-size:15px;padding:6px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}
.mcard::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 14px,color-mix(in srgb,var(--fog) 18%,transparent) 14px 15px)}
.mcard span{visibility:hidden}
.mcard.up,.mcard.ok{background:var(--raised)}
.mcard.up::after,.mcard.ok::after{display:none}
.mcard.up span,.mcard.ok span{visibility:visible}
.mcard.ok{background:var(--good-soft);border-color:var(--good)}
.mcard.isf{font-family:var(--f-is);font-size:18px}

.result{text-align:center;padding:24px 8px}
.result .big{font:300 46px var(--f-disp);letter-spacing:.05em}
.result p{margin:6px auto 18px;color:var(--muted)}

/* text */
.dlg{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.line{display:grid;grid-template-columns:64px 1fr;gap:12px}
.sp{font:500 11px var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--moss);padding-top:5px}
.txt{font:400 19px/1.65 var(--f-is)}
.txt .w{border-bottom-color:color-mix(in srgb,var(--slate) 45%,transparent)}
.tr{display:block;font:400 14px var(--f-body);color:var(--muted)}
.prose{font:400 20px/1.8 var(--f-is);max-width:60ch;margin:16px 0}

/* flashcards */
.fc-wrap{perspective:1200px;margin:16px auto;max-width:420px}
.fc{position:relative;height:260px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:0;background:linear-gradient(150deg,var(--paper),var(--paper-2));color:var(--paper-ink);box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:8px}
.fc-back{transform:rotateY(180deg);background:linear-gradient(150deg,#3c5236,#26372a);color:var(--ink)}
.fc-main{font:400 34px/1.2 var(--f-is)}
.fc-main.ru{font:400 24px/1.3 var(--f-body)}
.fc-sub{font:400 15px var(--f-mono);color:var(--slate)}
.fc-hint{position:absolute;bottom:14px;font:400 11px var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--paper-muted)}
.fc-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto}

{p:'Самое непривычное — три слова для «они». {þeir} — только мужчины, {þær} — только женщины, а если в группе есть и те и другие, говорят {þau}. Йоун и Анна — это {þau}.'},

{p:'В русском «я студент» обходится без глагола. В исландском глагол обязателен: «я есть студент». Это {vera}, самый частый глагол языка, и он неправильный, его формы просто запоминают.'},

{id:10,mod:1,t:'Род и артикль',s:'Мужской, женский, средний и «тот самый» в конце слова',text:'home',
theory:[
{h:'Три рода, как в русском'},
{p:'У каждого существительного есть род: мужской, женский или средний. Часто его подсказывает окончание.'},
{table:[['мужской','-ur, -i','{hestur}, {dagur}, {bolli}'],['женский','-a или согласная','{kona}, {kaka}, {bók}, {sól}'],['средний','согласная, без -ur','{hús}, {barn}, {fjall}, {land}']],head:['Род','Типичный конец','Примеры']},
{p:'Это подсказки, а не законы: {auga} (глаз) кончается на -a, но среднего рода. Поэтому новое слово лучше сразу учить вместе с родом.'},
{h:'Неопределённого артикля нет'},
{p:'{hús} — это просто «дом» или «какой-то дом». Как в русском, никаких a/an.'},
{h:'Определённый артикль — в конце слова'},
{p:'Чтобы сказать «тот самый дом», к слову приклеивают окончание: {hús} → {húsið}. Оно зависит от рода.'},
{table:[['мужской','-inn','{hestur} → {hesturinn}','{hundur} → {hundurinn}'],['женский','-in','{bók} → {bókin}','{sól} → {sólin}'],['средний','-ið','{hús} → {húsið}','{barn} → {barnið}']],head:['Род','Артикль','Пример','Пример']},
{p:'Если слово кончается на гласную, i из артикля выпадает: {bolli} → {bollinn}, {kona} → {konan}, {auga} → {augað}.'},
{h:'Он, она, оно — и для вещей'},
{p:'Как в русском, местоимение подбирается по роду, даже для предметов: {bókin} — {hún} (книга — она), {dagurinn} — {hann}, {húsið} — {það}. Но осторожно: кофе {kaffi} среднего рода, поэтому {kaffið} — {það}.'},
{tip:'Знаменитая Голубая лагуна по-исландски {Bláa lónið}. lón — «лагуна», среднего рода, поэтому с артиклем lónið. Теперь ты видишь артикль в названиях.'}
],

{id:21,mod:1,t:'Много: множественное число',s:'Один дом — много домов: окончания ‑ar и ‑ur и хитрый средний род',text:'farm',
theory:[
{h:'Окончание зависит от рода'},
{p:'В русском «дом — дома», «книга — книги». В исландском окончание множественного числа тоже зависит от рода, и основных правил всего три. Поэтому род из прошлого урока здесь очень пригодится.'},
{table:[['мужской','{hestur}','{hestar}','-ur → -ar'],['мужской','{dagur}','{dagar}','-ur → -ar'],['женский','{kona}','{konur}','-a → -ur'],['женский','{kaka}','{kökur}','-a → -ur, и a → ö'],['средний','{hús}','{hús}','не меняется'],['средний','{barn}','{börn}','не меняется, но a → ö']],head:['Род','Один','Много','Правило']},
{p:'Средний род — самый простой: одно {hús}, много {hús}. Только если в корне есть a, она становится ö: {barn} → {börn}, {fjall} → {fjöll}, {land} → {lönd}. Это тот же умлаут, что в tala → tölum, ты встретишь его в уроке о глаголах.'},
{h:'Исключения, которые ты уже видел'},
{p:'Некоторые мужские слова получают не -ar, а -ir: {vinur} → {vinir} (друзья). А {bók} → {bækur} (книги) — просто неправильное слово. Такие слова запоминают по одному, и их немного.'},
{h:'С числами'},
{p:'Помнишь числа с родом из урока про счёт? Теперь они складываются в пары: {tveir hestar} — две лошади, {tvær konur} — две женщины, {tvö hús} — два дома.'},
{h:'«Те самые» во множественном'},
{p:'Артикль на конце есть и здесь: {hestarnir} — те лошади, {konurnar} — те женщины, {húsin} — те дома, {börnin} — те дети. Пока достаточно узнавать эти формы в тексте.'},
{tip:'«Они» тоже выбирается по роду, как в уроке про местоимения: hestarnir → þeir, konurnar → þær, börnin → þau.'}
],

{id:11,mod:2,t:'Глаголы в настоящем времени',s:'Две главные группы глаголов и пять важных «неправильных»',text:'day',
theory:[
{h:'Глагол меняется по лицам'},
{p:'Как и в русском, окончание глагола показывает, кто действует: «я говорю», «ты говоришь». У большинства исландских глаголов неопределённая форма кончается на -a: {tala} — говорить, {borða} — есть, {læra} — учить.'},
{h:'Группа 1: tala, borða, dansa'},
{p:'Самая большая группа. Запомни окончания: -a, -ar, -ar, -um, -ið, -a.'},
{table:[['ég tala','я говорю','við tölum','мы говорим'],['þú talar','ты говоришь','þið talið','вы говорите'],['hann / hún talar','он / она говорит','þau tala','они говорят']],head:['Ед. ч.','','Мн. ч.','']},
{p:'Заметь: {tala} → {tölum}. Перед окончанием -um буква a в корне превращается в ö: {dansa} → {dönsum}. Это называется умлаут, исландцы делают его автоматически.'},
{p:'Так же спрягаются {borða}, {dansa}, {hlusta}, {elska}, {opna}.'},
{h:'Группа 2: læra, gera, heyra'},
{p:'Окончания: -i, -ir, -ir, -um, -ið, -a. Отличить эту группу по виду неопределённой формы нельзя, поэтому каждый новый глагол лучше учить вместе с формой «ты»: {læra} — {lærir}.'},
{table:[['ég læri','я учу','við lærum','мы учим'],['þú lærir','ты учишь','þið lærið','вы учите'],['hann / hún lærir','он / она учит','þau læra','они учат']],head:['Ед. ч.','','Мн. ч.','']},
{p:'Ты уже знаешь глагол этой группы: {heiti} — {heitir}. Сюда же {gera}, {heyra}, {keyra}.'},
{h:'Неправильные, но очень нужные'},
{table:[['{búa} жить','ég bý','þú býrð','hann býr','við búum'],['{fara} ехать, идти','ég fer','þú ferð','hann fer','við förum'],['{drekka} пить','ég drekk','þú drekkur','hann drekkur','við drekkum'],['{koma} приходить','ég kem','þú kemur','hann kemur','við komum'],['{hafa} иметь','ég hef','þú hefur','hann hefur','við höfum']],head:['Глагол','я','ты','он','мы']},
{p:'Примеры: {Ég tala íslensku}. {Við drekkum kaffi}. {Hún býr í Reykjavík}. {Þau hlusta á tónlist}.'},
{tip:'Хорошая новость: формы «он», «она» и «оно» всегда одинаковые, а форма «они» почти всегда совпадает с неопределённой. Значит, по-настоящему новых окончаний всего четыре.'}
],

{id:12,mod:2,t:'Порядок слов и вопросы',s:'Правило второго места, вопросительные слова и инверсия',text:'interview',
theory:[
{h:'Глагол — всегда второй'},
{p:'Главное правило исландского предложения: глагол стоит на втором месте. Обычно первым идёт подлежащее: {Ég fer heim}. Но если начать с другого слова — «сегодня», «сейчас», «завтра» — подлежащее уходит за глагол, а глагол остаётся вторым.'},
{table:[['{Ég fer heim}.','Я еду домой.'],['{Í dag fer ég heim}.','Сегодня я еду домой.'],['{Núna bý ég í Reykjavík}.','Сейчас я живу в Рейкьявике.'],['{Stundum dönsum við}.','Иногда мы танцуем.']],head:['Предложение','Перевод']},
{p:'В русском так тоже можно сказать («сегодня еду я домой»), но звучит странно. В исландском иначе нельзя. Так же устроены немецкий, норвежский и шведский.'},
{h:'Вопрос «да или нет»'},
{p:'Глагол выходит на первое место: {Talar þú íslensku}? — ты говоришь по-исландски? {Býrð þú hér}? — ты живёшь здесь?'},
{h:'Вопросительные слова'},
{table:[['{hvar}','где'],['{hvert}','куда'],['{hvaðan}','откуда'],['{hvenær}','когда'],['{hvað}','что'],['{hver}','кто'],['{hvernig}','как'],['{af hverju}','почему']],head:['Слово','Перевод']},
{p:'После вопросительного слова сразу идёт глагол, потом подлежащее: {Hvaðan ert þú}? {Hvar býrð þú}? {Hvenær ferð þú heim}?'},
{tip:'В живой речи þú прилипает к глаголу: ert þú → {ertu}, býrð þú → {býrðu}, talar þú → {talarðu}. На письме исландцы тоже часто так пишут, так что узнавай эти формы.'}
],

{id:13,mod:2,t:'Нет, никогда, может быть',s:'ekki, aldrei, jú и маленькие слова, которые делают речь живой',text:'chat',
theory:[
{h:'Куда ставить ekki'},
{p:'{ekki} ставится после глагола: {Ég er ekki heima} — я не дома. Если подлежащее стоит после глагола (в вопросе или после «сегодня»), то ekki идёт уже после подлежащего: {Talar þú ekki íslensku}? {Í dag fer ég ekki}.'},
{p:'Так же ведут себя слова-«частоты»: {aldrei} — никогда, {alltaf} — всегда, {oft} — часто, {stundum} — иногда. {Hann drekkur aldrei kaffi} — он никогда не пьёт кофе. Обрати внимание: «не» отдельно не нужно, aldrei уже отрицание.'},
{h:'Три слова для «да» и «нет»'},
{table:[['{já}','да — на обычный вопрос','{Talar þú íslensku}? — Já.'],['{nei}','нет','{Ertu heima}? — Nei.'],['{jú}','да — на вопрос с отрицанием','{Talar þú ekki íslensku}? — Jú!']],head:['Слово','Когда','Пример']},
{p:'{jú} — маленькое сокровище исландского. На вопрос «ты не говоришь по-исландски?» ответ «já» прозвучит неясно. А {jú} значит «нет, говорю!», то есть «да» вопреки отрицанию. Как французское si или немецкое doch.'},
{h:'Полезные маленькие слова'},
{table:[['{kannski}','может быть'],['{líka}','тоже'],['{ekki heldur}','тоже не'],['{ekkert}','ничего'],['{Ég veit það ekki}','я не знаю'],['{Ég ekki heldur}','я тоже нет']],head:['Слово','Перевод']},
{tip:'«Ég veit það ekki» — дословно «я знаю это не». Исландцы почти всегда добавляют það, так фраза звучит естественно. Запомни её целиком, это одна из самых нужных фраз.'}
],

{id:14,mod:3,t:'Зачем нужны падежи',s:'Четыре падежа вместо русских шести — и ты их уже встречал',text:'book',
theory:[
{h:'Ты уже знаешь, что такое падеж'},
{p:'В русском мы говорим «Анна», но «вижу Анну», «даю Анне», «книга Анны». Слово меняет окончание в зависимости от роли в предложении. Исландский устроен так же, только падежей четыре, а не шесть.'},
{table:[['{nefnifall}','именительный','кто? что?','{Þetta er Anna}.'],['{þolfall}','винительный','кого? что? (вижу)','{Ég sé Önnu}.'],['{þágufall}','дательный','кому? чему?','{Ég gef Önnu bók}.'],['{eignarfall}','родительный','чей? кого? чего?','{Þetta er bók Önnu}.']],head:['Падеж','По-русски','Вопрос','Пример']},
{p:'Имена тоже склоняются, как у нас. Мужское имя Jón: {Þetta er Jón} — {Ég sé Jón} — {Ég gef Jóni bók} — {Þetta er bók Jóns}. Обрати внимание: в винительном Jón не меняется.'},
{h:'Ты их уже встречал'},
{table:[['{frá Íslandi}','из Исландии','дательный после frá'],['{á Íslandi}','в Исландии','дательный: где?'],['{höfuðborg Íslands}','столица Исландии','родительный: чья?'],['{til Akureyrar}','в Акюрейри','родительный после til'],['{Ég tala íslensku}','говорю по-исландски','винительный: что?']],head:['Фраза','Перевод','Падеж']},
{p:'Все эти «странные» окончания из прошлых уроков — падежи. Теперь ты знаешь, откуда они берутся.'},
{tip:'Не пытайся выучить все таблицы сразу. Исландцы тоже учат падежи годами, а иностранцы, которые говорят с ошибками в падежах, прекрасно понятны. Сначала научись узнавать падеж в тексте, а употреблять придёт со временем.'}
],

{id:15,mod:3,t:'Меня, мне: винительный и дательный',s:'Местоимения в падежах, «мне холодно» и окончания существительных',text:'pool',
theory:[
{h:'Местоимения'},
{table:[['ég','{mig}','{mér}','меня / мне'],['þú','{þig}','{þér}','тебя / тебе'],['hann','{hann}','{honum}','его / ему'],['hún','{hana}','{henni}','её / ей'],['það','{það}','{því}','его / ему (оно)'],['við','{okkur}','{okkur}','нас / нам'],['þið','{ykkur}','{ykkur}','вас / вам'],['þeir','{þá}','{þeim}','их / им'],['þær, þau','þær, þau','{þeim}','их / им']],head:['Кто','Вин. (кого?)','Дат. (кому?)','Перевод']},
{p:'Местоимения — самая частая часть падежной системы, их стоит выучить первыми. {Ég elska þig} — я тебя люблю. {Hún sér hann} — она видит его. {Ég gef þér bók} — я даю тебе книгу.'},
{h:'Какой глагол — какой падеж'},
{p:'Большинство глаголов требуют винительного, как в русском: {sjá} (видеть), {elska}, {hafa}, {borða}, {drekka}. Но некоторые требуют дательного: {hjálpa} — помогать (кому?): {Hjálpaðu mér}! Глагол {gefa} берёт оба: кому — дательный, что — винительный.'},
{h:'«Мне холодно» — совсем как по-русски'},
{p:'Ощущения в исландском, как и у нас, выражаются через «мне»: {Mér er kalt} — мне холодно. {Mér er heitt} — мне жарко. {Mér líður vel} — мне хорошо. Русскоговорящим это даётся легче, чем англичанам.'},
{h:'Существительные'},
{table:[['мужской','hestur','{hest}','{hesti}','{hests}'],['женский','kona','{konu}','{konu}','{konu}'],['женский','bók','bók','bók','{bókar}'],['средний','hús','hús','{húsi}','{húss}']],head:['Род','Им.','Вин.','Дат.','Род.']},
{p:'Закономерности: у мужского рода в винительном отпадает -ur, у среднего винительный совпадает с именительным. Женские на -a во всех косвенных падежах кончаются на -u.'},
{tip:'Для полных форм любого слова есть база BÍN (ссылка на странице «Как учиться»). Вводишь слово — получаешь все его падежи. Исландцы и сами туда заглядывают.'}
],

theory:[
{h:'Предлог выбирает падеж'},
{p:'Как и в русском («без чего?», «к кому?»), за каждым предлогом закреплён свой падеж. Учи предлоги сразу группами.'},
{table:[['винительный','{um}','о, про'],['дательный','{frá}, {hjá}, {að}, {af}','из, у, к, с/от'],['дательный','{með}','с (кем-то, чем-то)'],['родительный','{til}, {án}','к, в (куда); без']],head:['Падеж','Предлоги','Значение']},
{p:'Примеры: {bók um Ísland} — книга об Исландии. {Ég er hjá Önnu} — я у Анны. {Komdu með mér}! — пойдём со мной! {Ég fer til Íslands} — я еду в Исландию. {kaffi án mjólkur} — кофе без молока.'},
{h:'í и á: где или куда'},
{p:'Самое полезное правило. Предлоги {í} (в) и {á} (на, в) берут дательный, когда отвечают на вопрос «где?», и винительный, когда «куда?». В русском почти то же самое: «в доме» и «в дом».'},
{table:[['{Ég er í húsinu}','я в доме','где? → дательный'],['{Ég fer í húsið}','я иду в дом','куда? → винительный'],['{Ég er á kaffihúsi}','я в кафе','где? → дательный'],['{Ég fer á kaffihús}','я иду в кафе','куда? → винительный']],head:['Фраза','Перевод','Правило']},
{h:'Страна: á, í или til?'},
{p:'С Исландией говорят {á Íslandi} — «на Исландии», как мы говорим «на Кубе»: это остров. А ехать в Исландию — {til Íslands}. С большинством других стран — í: í Rússlandi, в России.'},
{tip:'В кафе пригодится: {kaffi með mjólk} — кофе с молоком, {kaffi án mjólkur} — без молока. Заметь, как mjólk меняется после án: это родительный.'}
],

{id:17,mod:4,t:'Семья',s:'Родственники, «мой» и «твой» и исландские отчества',text:'family',
theory:[
{h:'Кто есть кто'},
{table:[['{mamma} / {móðir}','мама / мать'],['{pabbi} / {faðir}','папа / отец'],['{bróðir}','брат'],['{systir}','сестра'],['{sonur}','сын'],['{dóttir}','дочь'],['{amma}','бабушка'],['{afi}','дедушка'],['{foreldrar}','родители'],['{systkini}','братья и сёстры'],['{börn}','дети']],head:['Слово','Перевод']},
{p:'mamma и pabbi — как наши «мама» и «папа», ими пользуются всегда. móðir и faðir звучат официально, как «мать» и «отец».'},
{h:'Мой, твой — после слова'},
{p:'Притяжательное слово ставится после существительного и согласуется с ним по роду: {mamma mín} — моя мама, {pabbi minn} — мой папа.'},
{table:[['мой','{minn}','{mín}','{mitt}'],['твой','{þinn}','{þín}','{þitt}'],['его / её','{hans}','{hennar}','не меняются'],['наш','{okkar}','{okkar}','{okkar}']],head:['','Муж.','Жен.','Сред.']},
{p:'С родственниками говорят без артикля: {bróðir minn}. С остальными словами обычно с артиклем: {húsið mitt} — мой дом, {hundurinn minn} — моя собака.'},
{h:'«У меня есть»'},
{p:'Про родственников и вещи говорят глаголом {eiga}: {Ég á bróður og systur} — у меня есть брат и сестра. {Átt þú systkini}? — у тебя есть братья или сёстры?'},
{h:'Фамилий почти нет'},
{p:'У большинства исландцев вместо фамилии — отчество. К имени отца в родительном падеже добавляют -son (сын) или -dóttir (дочь). Сын Эйнара — {Einarsson}, дочь Йоуна — {Jónsdóttir}. У брата и сестры «фамилии» разные, а у мамы — своя, по её отцу.'},
{tip:'Поэтому в Исландии все обращаются друг к другу по имени, а телефонные справочники сортируют по именам. И вот где пригодился родительный падеж: Jón → Jóns → Jónsdóttir.'}
],

theory:[
{h:'На столе'},
{table:[['{matur}','еда'],['{brauð}','хлеб'],['{ostur}','сыр'],['{fiskur}','рыба'],['{kjöt}','мясо'],['{súpa}','суп'],['{egg}','яйцо'],['{epli}','яблоко'],['{skyr}','скир'],['{pylsa}','хот-дог, сосиска']],head:['Еда','Перевод']},
{table:[['{vatn}','вода'],['{kaffi}','кофе'],['{te}','чай'],['{mjólk}','молоко'],['{safi}','сок'],['{bjór}','пиво']],head:['Напитки','Перевод']},
{h:'Как заказать'},
{table:[['{Get ég fengið} …?','Можно мне …?'],['{Ég ætla að fá} …','Я возьму …'],['{Reikninginn, takk}','Счёт, пожалуйста'],['{Mér finnst} … gott','Мне нравится …'],['{Ég er svangur} / {svöng}','Я голоден / голодна'],['{Ég er grænmetisæta}','Я вегетарианец']],head:['Фраза','Значение']},
{p:'После «get ég fengið» и «ég ætla að fá» нужен винительный: {fisk} (а не fiskur), {kjötsúpu} (а не kjötsúpa). Средний род не меняется: kaffi, brauð, vatn.'},
{h:'Вкусно: прилагательные тоже имеют род'},
{p:'Прилагательное меняется вслед за существительным, как в русском «вкусный, вкусная, вкусное»: {Fiskurinn er góður}. {Súpan er góð}. {Kaffið er gott}. Поэтому в фразе «Mér finnst … gott» слово gott — средний род, «это хорошо».'},
{h:'За столом'},
{p:'{Skál}! — тост, «будем!». Когда тебя благодарят за угощение, отвечают {Verði þér að góðu} — «на здоровье», дословно «пусть пойдёт тебе на пользу».'},
{h:'Два исландских блюда'},
{p:'{Kjötsúpa} — густой суп из баранины с овощами, им греются зимой. А хот-доги исландцы любят так, что в Рейкьявике у киоска с ними стоят очереди. Классический заказ: {eina með öllu} — «одну со всем», то есть со всеми соусами и луком.'},
{tip:'Учи еду через то, что ешь сам. Сегодня за завтраком назови по-исландски всё, что на столе: brauð, ostur, kaffi. Это лучший способ запомнить бытовую лексику.'}
],

const KEY='islenska-v1';
function fresh(){return {chips:0,done:{},lessons:{},cards:{},seen:{},last:1,streak:{d:'',n:0},voice:'f',auto:true,earned:0,spent:0,perfect:0,ear:0,remember:0,ach:{},lastBackup:0,eyja:false,owl:false,early:false,shop:{cards:[],scenes:[],scene:'moss',freeze:0,bought:0}}}

try{const raw=localStorage.getItem(KEY);if(raw){const st=JSON.parse(raw);S=Object.assign(fresh(),st);S.shop=Object.assign(fresh().shop,st.shop||{});if(!st.earned&&st.chips)S.earned=st.chips}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[?!.,…:;«»"]/g,'').replace(/\s+/g,' ').trim();
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function chipsWord(n){const m=n%100,d=n%10;if(m>=11&&m<=14)return 'чипсей';if(d>=1&&d<=4)return 'чипси';return 'чипсей'}
const dayStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dayStr(new Date());

function addChips(n,el){
  S.chips+=n;S.earned+=n;
  if(!addChips.p){addChips.p=1;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}}
  const t=today();
  if(S.streak.d!==t){
    const gap=S.streak.d?Math.round((new Date(t)-new Date(S.streak.d))/864e5):0;
    if(gap===1)S.streak.n++;
    else if(gap>1&&S.shop.freeze>=gap-1){S.shop.freeze-=gap-1;S.streak.n++;setTimeout(()=>toast('Заморозка сохранила твою серию дней'),1200)}
    else S.streak.n=1;
    S.streak.d=t;
  }
  const hr=new Date().getHours();if(hr>=23)S.owl=true;if(hr<7)S.early=true;
  save();$('#chipsN').textContent=S.chips;setTimeout(checkAch,400);
  const r=(el||$('#chipsBtn')).getBoundingClientRect();
  const f=document.createElement('div');f.className='fly';f.textContent='+'+n;
  f.style.left=(r.left+r.width/2-10)+'px';f.style.top=(r.top-4)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
}

const AUD={cache:{},pend:{},el:null};
function audEl(){if(!AUD.el){AUD.el=new Audio();AUD.el.preload='auto'}return AUD.el}
function loadGroup(g){
  const key=S.voice+'-'+g;
  if(AUD.cache[key])return Promise.resolve(AUD.cache[key]);
  if(AUD.pend[key])return AUD.pend[key];
  return AUD.pend[key]=fetch('audio/'+key+'.json').then(r=>r.ok?r.json():{}).catch(()=>({})).then(d=>(AUD.cache[key]=d));
}
const groupOf=k=>LEX[k]?'l'+LEX[k][2]:null;
function playB64(b,onEnd){const a=audEl();if(!b){onEnd&&onEnd();return false}a.onended=onEnd||null;a.src='data:audio/mpeg;base64,'+b;const pr=a.play();if(pr)pr.catch(()=>{onEnd&&onEnd()});return true}
function playKey(k,onEnd){
  k=norm(k);if(k==='eyjafjallajökull'&&!S.eyja){S.eyja=true;save();setTimeout(checkAch,1500)}const g=groupOf(k);if(!g){speak(k)||onEnd&&onEnd();return}
  const c=AUD.cache[S.voice+'-'+g];
  if(c){if(!playB64(c[k],onEnd))speak(k);return}
  loadGroup(g).then(c=>{if(!playB64(c[k],onEnd))speak(k)});
}
function playLine(t,i,onEnd){const g='t-'+t,c=AUD.cache[S.voice+'-'+g];if(c)return playB64(c[i],onEnd);loadGroup(g).then(c=>playB64(c[i],onEnd))}

/* ============ РАЗМЕТКА СЛОВ ============ */
function lex(k){return LEX[norm(k)]}
function wspan(disp,key){key=key||disp;return `<span class="w" tabindex="0" data-k="${esc(norm(key))}" data-d="${esc(disp.replace(/[?!.,]+$/,''))}">${esc(disp)}</span>`}
// {слово} или {показ|ключ} в теории
function rich(s){return s.replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,a,b)=>wspan(a,b))}
// автоматическая разметка исландского текста + {фразы}
function auto(s){
  const parts=s.split(/(\{[^}]+\})/);
  return parts.map(p=>{
    if(p.startsWith('{')){const m=p.slice(1,-1).split('|');return wspan(m[0],m[1])}
    return p.split(/([A-Za-zÁÐÉÍÓÚÝÞÆÖáðéíóúýþæö]+)/).map(t=>/^[A-Za-zÁÐÉÍÓÚÝÞÆÖáðéíóúýþæö]+$/.test(t)&&LEX[t.toLowerCase()]?wspan(t,t):esc(t)).join('');
  }).join('');
}

  let sd=97;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;
  (THEMES[S.shop.scene]||THEMES.moss).ridges.forEach((col,L)=>{const base=H*(.72+L*.08),amp=H*(.12-L*.02),ph=rnd()*6,f=1+rnd()*2;

  return `<div class="result"><div class="eyebrow">результат</div><div class="big">${ok} / ${tot}</div><p>${msg}${bonus?` Бонус за прохождение: +${bonus} ${chipsWord(bonus)}.`:''}</p><div class="cta" style="justify-content:center"><button class="btn ghost again">Ещё раз</button><button class="btn back2">К заданиям</button></div></div>`;

      if(done===P.length)setTimeout(()=>fin(Math.max(0,P.length-miss),P.length),500)}
    else{miss++;[sel,b].forEach(x=>{x.classList.add('bad','shake');setTimeout(()=>x.classList.remove('bad','shake','sel'),450)});sel=null}

sort(body,ex,fin,bar,txt){
  const items=shuffle(ex.items.slice());let i=0,ok=0;const cnt=ex.buckets.map(()=>0);
  const step=()=>{
    if(i>=items.length)return fin(ok,items.length);

    body.innerHTML=`<div class="sort-item ${ex.ice?'':''}">${esc(it[0])}</div><div class="buckets">${ex.buckets.map((b,j)=>`<button class="bucket" data-j="${j}">${b}<span class="cnt">${cnt[j]} шт.</span></button>`).join('')}</div><div class="fb"></div>`;
    body.querySelectorAll('.bucket').forEach(b=>b.onclick=()=>{
      body.querySelectorAll('.bucket').forEach(x=>x.disabled=true);

      else{b.classList.add('shake');fb.className='fb b';fb.innerHTML=`Нет, это «${ex.buckets[it[1]]}».`+(it[2]?`<span class="why">${it[2]}</span>`:'');
        const n=document.createElement('button');n.className='btn next';n.textContent='Дальше →';n.onclick=()=>{i++;step()};body.appendChild(n)}
    });

build(body,ex,fin,bar,txt){
  const items=ex.items.slice();let i=0,ok=0;
  const step=()=>{
    if(i>=items.length)return fin(ok,items.length);
    setProg(bar,txt,i,items.length);const it=items[i];
    const parts=ex.letters?it.a.split(''):it.a.split(' ');
    const tiles=shuffle(parts.concat(it.extra||[]).map((t,k)=>({t,k})));
    const ans=[];const sep=ex.letters||ex.join===''?'':' ';
    body.innerHTML=`<div class="q">${esc(it.ru)}</div><div class="slot" id="slot"></div><div class="tiles">${tiles.map(t=>`<button class="tile" data-k="${t.k}">${esc(t.t)}</button>`).join('')}</div><div class="fb"></div><div class="cta"><button class="btn" id="chk" disabled>Проверить</button><button class="btn ghost" id="clr">Сбросить</button></div>`;
    const slot=body.querySelector('#slot'),chk=body.querySelector('#chk');
    const draw=()=>{slot.innerHTML=ans.map((t,x)=>`<button class="tile" data-x="${x}">${esc(t.t)}</button>`).join('');chk.disabled=!ans.length;
      slot.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const t=ans.splice(+b.dataset.x,1)[0];body.querySelector(`.tiles [data-k="${t.k}"]`).classList.remove('used');draw()})};
    body.querySelectorAll('.tiles .tile').forEach(b=>b.onclick=()=>{if(b.classList.contains('used'))return;b.classList.add('used');ans.push(tiles.find(t=>t.k==b.dataset.k));draw()});
    body.querySelector('#clr').onclick=()=>{ans.length=0;body.querySelectorAll('.tiles .tile').forEach(b=>b.classList.remove('used'));draw()};
    chk.onclick=()=>{
      const got=ans.map(t=>t.t).join(sep),want=parts.join(sep),fb=body.querySelector('.fb');
      body.querySelectorAll('.tile').forEach(b=>b.disabled=true);chk.disabled=true;body.querySelector('#clr').disabled=true;
      if(norm(got)===norm(want)){ok++;good(chk);fb.className='fb g';fb.innerHTML=`Верно! <span class="is" style="font-size:18px">${esc(want)}</span>`}
      else{fb.className='fb b';fb.innerHTML=`Правильно так: <span class="is" style="font-size:18px">${esc(want)}</span>`}
      const n=document.createElement('button');n.className='btn next';n.textContent=i+1<items.length?'Дальше →':'Готово';n.onclick=()=>{i++;step()};body.appendChild(n);
    };
  };step();
},
type(body,ex,fin,bar,txt){
  const items=shuffle(ex.items.slice());let i=0,ok=0;
  const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  const step=()=>{
    if(i>=items.length)return fin(ok,items.length);
    setProg(bar,txt,i,items.length);const it=items[i];
    body.innerHTML=`<div class="q">Напиши по-исландски: <b>${esc(it.q)}</b></div><input class="inp" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ"><div class="keys">${'á é í ó ú ý þ ð æ ö'.split(' ').map(k=>`<button class="key" data-c="${k}">${k}</button>`).join('')}</div><div class="fb"></div><div class="cta"><button class="btn" id="chk">Проверить</button><button class="btn ghost" id="skip">Не знаю</button></div>`;
    const inp=body.querySelector('#tin');inp.focus();
    body.querySelectorAll('.key').forEach(k=>k.onclick=()=>{const s=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,s)+k.dataset.c+inp.value.slice(inp.selectionEnd??s);inp.focus();inp.setSelectionRange(s+1,s+1)});
    const end=(right,msg)=>{const fb=body.querySelector('.fb');inp.disabled=true;body.querySelectorAll('.key,#chk,#skip').forEach(b=>b.disabled=true);
      fb.className='fb '+(right?'g':'b');fb.innerHTML=msg;
      const n=document.createElement('button');n.className='btn next';n.textContent=i+1<items.length?'Дальше →':'Готово';n.onclick=()=>{i++;step()};body.appendChild(n);n.focus()};
    const check=()=>{const v=norm(inp.value);if(!v)return;
      if(it.a.some(a=>norm(a)===v)){ok++;good(inp);end(true,'Верно!')}
      else if(it.a.some(a=>strip(norm(a))===strip(v)))end(false,`Почти! Проверь чёрточки: <span class="is" style="font-size:18px">${esc(it.a[0])}</span>`);
      else end(false,`Правильно: <span class="is" style="font-size:18px">${esc(it.a[0])}</span>`)};
    body.querySelector('#chk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
    body.querySelector('#skip').onclick=()=>end(false,`Ответ: <span class="is" style="font-size:18px">${esc(it.a[0])}</span>`);
  };step();
},
memory(body,ex,fin,bar,txt){
  const cards=shuffle(ex.pairs.flatMap((p,i)=>[{t:p[0],i,is:ex.ice||ex.iceL},{t:p[1],i,is:ex.ice}]));
  let open=[],done=0,tries=0,lock=false;
  body.innerHTML=`<p class="lead" style="margin:0 0 12px">Открывай по две карты. Найди все пары.</p><div class="mem">${cards.map((c,k)=>`<button class="mcard ${c.is?'isf':''}" data-k="${k}"><span>${esc(c.t)}</span></button>`).join('')}</div>`;
  setProg(bar,txt,0,ex.pairs.length);
  body.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('up')||b.classList.contains('ok'))return;
    b.classList.add('up');open.push(b);
    if(open.length===2){tries++;const[a,c]=open;const A=cards[a.dataset.k],C=cards[c.dataset.k];
      if(A.i===C.i){a.classList.replace('up','ok');c.classList.replace('up','ok');open=[];done++;good(c);setProg(bar,txt,done,ex.pairs.length);
        if(done===ex.pairs.length){const sc=Math.max(1,ex.pairs.length-Math.max(0,tries-ex.pairs.length-2));setTimeout(()=>fin(sc,ex.pairs.length),600)}}
      else{lock=true;setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');open=[];lock=false},850)}}
  });
}
};

const achQ=[];let achBusy=false;
function checkAch(quiet){
  let got=false;
  ACH.forEach(a=>{if(!S.ach[a.id]&&a.c()){S.ach[a.id]=Date.now();S.chips+=a.r;S.earned+=a.r;achQ.push(a);got=true}});
  if(got){save();$('#chipsN').textContent=S.chips;renderDrawer();if(!quiet)showNextAch()}
}
function inGame(){const g=document.querySelector('.game');return !!(g&&!g.querySelector('.result'))}
let achWait=null;
function showNextAch(){if(achBusy||!achQ.length)return;if(inGame()){clearTimeout(achWait);achWait=setTimeout(showNextAch,1200);return}achBusy=true;openCard(achQ.shift(),'ach')}

function inClaude(){return !!(window.claude&&window.claude.use)}
/* Сохранение файла: в Claude — через его окно сохранения; на айфоне/айпаде — через меню «Поделиться» (там есть «Сохранить в Файлы» и «Сохранить изображение»); на компьютере — обычное скачивание */
async function saveFile(name,blob){
  if(inClaude()){const dl=await claudeUse('downloads');if(!dl)throw {code:'unavailable'};await dl.save({filename:name,data:blob});return 'saved'}
  const touch=matchMedia('(pointer: coarse)').matches;
  if(touch&&navigator.share&&navigator.canShare){
    for(const type of [blob.type||'application/octet-stream','text/plain']){
      let f;try{f=new File([blob],name,{type})}catch(e){break}
      if(navigator.canShare({files:[f]})){
        try{await navigator.share({files:[f]});return 'shared'}
        catch(e){if(e&&e.name==='AbortError')throw {code:'declined'};break}
      }
    }
  }
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);return 'downloaded';
}
async function claudeUse(n){try{return window.claude&&window.claude.use?await window.claude.use(n):null}catch(e){return null}}

  catch(e){b.disabled=false;b.textContent=e&&e.code==='declined'?label:e&&e.code==='unavailable'?'Сохранение недоступно здесь':'Не получилось, ещё раз'}
}

  const json=exportJSON();
  const undo=()=>{S=normState(JSON.parse(snap));for(let i=achQ.length-1;i>=0;i--)if(!before.has(achQ[i].id))achQ.splice(i,1);save();$('#chipsN').textContent=S.chips;renderDrawer()};

  catch(e){if(e&&e.code==='declined'){undo();toast('Сохранение отменено');return}}

   <textarea class="bk-ta" id="bkTa" readonly aria-label="Текст резервной копии"></textarea>
   <div class="cta"><button class="btn amber" id="bkCopy">Скопировать</button><button class="btn ghost" data-close>Закрыть</button></div>`);
  $('#bkTa').value=json;
  const ok=()=>{S=normState(JSON.parse(json).state);save();$('#chipsN').textContent=S.chips;$('#bkCopy').textContent='Скопировано ✓';refreshAfterBackup()};
  $('#bkCopy').onclick=()=>{try{navigator.clipboard.writeText(json).then(ok,()=>{$('#bkTa').select();try{document.execCommand('copy');ok()}catch(e){}})}catch(e){$('#bkTa').select();try{document.execCommand('copy');ok()}catch(e2){}}};
}
function refreshAfterBackup(){renderDrawer();showNextAch();if(VIEW.v==='home')viewHome()}
function openRestore(){
  openModal(`<div class="eyebrow">Восстановление</div><h2 class="mh">Восстановить прогресс</h2>
   <p class="lead">Выбери файл <span class="is">islenska-progress-….json</span>. На айфоне — в приложении «Файлы», в папке, куда ты его сохранил (обычно iCloud Drive). На маке — в папке «Загрузки» или в iCloud Drive.</p>
   <div class="cta"><label class="btn amber" for="rsFile">Выбрать файл</label><input type="file" id="rsFile" accept=".json,application/json,text/plain" hidden><button class="btn ghost" id="rsPasteB">Вставить текст</button></div>
   <div id="rsPaste" hidden><textarea class="bk-ta" id="rsTa" placeholder="Вставь сюда текст резервной копии" aria-label="Текст резервной копии"></textarea><div class="cta"><button class="btn" id="rsTaGo">Проверить текст</button></div></div>
   <div id="rsInfo"></div><div class="cta"><button class="btn ghost" data-close>Закрыть</button></div>`);
  $('#rsPasteB').onclick=()=>{$('#rsPaste').hidden=false;$('#rsTa').focus()};
  $('#rsFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>preview(String(r.result));r.readAsText(f)};
  $('#rsTaGo').onclick=()=>preview($('#rsTa').value);
  function preview(txt){
    let o;try{o=JSON.parse(txt.trim())}catch(e){o=null}
    const info=$('#rsInfo');
    if(!o||o.app!=='islenska'||!o.state||typeof o.state!=='object'){info.innerHTML='<p class="fb b">Это не файл прогресса Íslenska. Проверь, что выбран правильный файл.</p>';return}
    const when=o.savedAt?new Date(o.savedAt).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'';
    info.innerHTML=`<div class="rs-sum"><b>Найден прогресс${when?' от '+when:''}</b><span>${summaryOf(o.state)}</span><span class="rs-warn">Текущий прогресс на этом устройстве заменится этим.</span></div><div class="cta"><button class="btn amber" id="rsGo">Восстановить</button></div>`;
    $('#rsGo').onclick=()=>{S=normState(o.state);save();applyTheme();drawBackdrop();closeModal();$('#chipsN').textContent=S.chips;go('home');toast('Прогресс восстановлен')};
  }
}
function normState(st){const f=fresh();const s=Object.assign(f,st);s.shop=Object.assign(fresh().shop,st.shop||{});s.streak=Object.assign(fresh().streak,st.streak||{});['done','lessons','cards','seen','ach'].forEach(k=>{if(!s[k]||typeof s[k]!=='object')s[k]={}});return s}
function openModal(html){const m=$('#modal');$('#modalIn').innerHTML=html;m.hidden=false;requestAnimationFrame(()=>m.classList.add('on'));m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){const m=$('#modal');m.classList.remove('on');setTimeout(()=>m.hidden=true,200)}

/* ============ ПРИВЕТСТВИЕ ============ */
function showIntro(){
  openModal(`<div class="eyebrow">Velkomin · добро пожаловать</div><h2 class="mh">Как заниматься</h2>
  <p class="lead">Это самоучитель для полного новичка. Каждый урок проходится по шагам — они идут вкладками в том же порядке:</p>
  <ol class="steps"><li><b>Теория.</b> Читай и нажимай на исландские слова: они звучат и показывают перевод.</li><li><b>Слова.</b> Послушай их и добавь в карточки.</li><li><b>Практика.</b> 5–6 заданий на правила и слова. За ответы капают чипси.</li><li><b>Текст.</b> Короткий текст с вопросами — есть в большинстве уроков.</li></ol>
  <p class="lead"><b>Каждый день</b> — 5–10 минут карточек, даже если нет времени на новый урок. Раз в пару дней сохраняй прогресс через меню.</p>
  <div class="cta"><button class="btn amber" id="introGo">Начать урок 1</button><button class="btn ghost" id="introLook">Сначала осмотрюсь</button></div>`);
  const done=()=>{S.intro=true;save();closeModal()};
  $('#introGo').onclick=()=>{done();go('lesson',LESSONS[0].id)};$('#introLook').onclick=done;
}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='reIntro')showIntro()});
/* неразрывный дефис: «-ur» не должен рваться на «-» и «ur» */
const NBH_RE=/-(?=[A-Za-zÁÐÉÍÓÚÝÞÆÖáðéíóúýþæöА-Яа-яЁё])/g;
function fixHyphens(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const list=[];while(n=w.nextNode()){if(n.nodeValue.indexOf('-')>-1&&!n.parentElement.closest('script,style,textarea'))list.push(n)}list.forEach(t=>{const v=t.nodeValue.replace(NBH_RE,'‑');if(v!==t.nodeValue)t.nodeValue=v})}
let fhT;new MutationObserver(()=>{clearTimeout(fhT);fhT=setTimeout(()=>{fixHyphens($('#app'));fixHyphens($('#modal'));fixHyphens($('#cardOv'));fixHyphens($('#sheet'))},0)}).observe(document.body,{childList:true,subtree:true,characterData:false});
/* старт */
$('#chipsN').textContent=S.chips;
migrateCards();applyTheme();drawBackdrop();
go('home');
setTimeout(()=>{if(!S.intro&&!hasProgress())showIntro();else{S.intro=true;save()}checkAch()},800);
</script>
